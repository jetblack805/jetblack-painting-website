name: Deploy to Manus

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install || pnpm install
      
      - name: Build project
        run: npm run build || pnpm build
      
      - name: Deploy to Manus
        run: |
          echo "Deployment triggered for Manus"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
        env:
          MANUS_API_TOKEN: ${{ secrets.MANUS_API_TOKEN }}
          MANUS_PROJECT_ID: ${{ secrets.MANUS_PROJECT_ID }}
