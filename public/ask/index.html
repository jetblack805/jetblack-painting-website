<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Internal tool for Jetblack Painting. Sends a post-job Google review request to a customer. Not a public page.">
<title>Ask for a review — Jetblack Painting</title>
<!--
  Jimmy's own tool, not a customer page. noindex + nofollow, absent from the
  sitemap, and linked from nowhere. It exists so that asking for a review is a
  fifteen-second job done standing in a driveway, because anything slower does
  not get done at all.

  Add to Home Screen on the phone. The token is entered once and kept in
  localStorage on that device.

  ⚠️ Do not add a "were they happy?" step, a star rating, or anything that sends
  unhappy customers somewhere other than the review form. That is review gating
  and Google strips listings for it. See worker/review-request.js.
-->
<style>
  :root { color-scheme: light dark; --bg:#f4f4f6; --card:#fff; --ink:#17171a; --muted:#6b6b73; --line:#dedee3; --accent:#0A0A0B; --ok:#1a7f4b; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e0e10; --card:#1a1a1d; --ink:#f2f2f4; --muted:#a0a0a8; --line:#2e2e33; --accent:#f2f2f4; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 16px 40px; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  .wrap { max-width:460px; margin:0 auto; }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.9rem; margin:0 0 20px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  label { display:block; font-size:.82rem; font-weight:600; margin:14px 0 5px; letter-spacing:.01em; }
  label:first-of-type { margin-top:0; }
  input { width:100%; padding:13px 12px; font-size:16px; /* 16px stops iOS zooming on focus */
          border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  .hint { color:var(--muted); font-size:.76rem; margin-top:4px; }
  button { width:100%; margin-top:20px; padding:15px; font-size:1rem; font-weight:600;
           border:0; border-radius:9px; background:var(--accent); color:var(--bg); }
  button[disabled] { opacity:.55; }
  #msg { margin-top:14px; font-size:.9rem; min-height:1.3em; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  details { margin-top:18px; font-size:.82rem; color:var(--muted); }
  summary { cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ask for a review</h1>
  <p class="sub">Only for jobs that are actually finished.</p>

  <form id="f" autocomplete="off">
    <label for="firstName">First name</label>
    <input id="firstName" name="firstName" type="text" autocapitalize="words" required>

    <label for="email">Their email</label>
    <input id="email" name="email" type="email" inputmode="email" autocapitalize="off" autocorrect="off" required>

    <label for="suburb">Suburb <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
    <input id="suburb" name="suburb" type="text" autocapitalize="words">

    <label for="job">Job <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
    <input id="job" name="job" type="text" placeholder="exterior repaint">
    <div class="hint">Goes into the email as “The exterior repaint is finished”.</div>

    <button id="go" type="submit">Send request</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>

  <details>
    <summary>Change access code</summary>
    <p>Stored on this device only. Clearing it will prompt again on the next send.</p>
    <button type="button" id="clear" style="background:transparent;color:var(--muted);border:1px solid var(--line);">Clear saved code</button>
  </details>
</div>

<script>
(function () {
  var KEY = "jb_review_token";
  var f = document.getElementById("f");
  var msg = document.getElementById("msg");
  var go = document.getElementById("go");

  function say(text, cls) { msg.textContent = text; msg.className = cls || ""; }

  function token() {
    var t = null;
    try { t = localStorage.getItem(KEY); } catch (e) { /* private mode */ }
    if (!t) {
      t = window.prompt("Access code (one time on this device)");
      if (t) { try { localStorage.setItem(KEY, t); } catch (e) {} }
    }
    return t;
  }

  document.getElementById("clear").addEventListener("click", function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    say("Code cleared.", "ok");
  });

  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var t = token();
    if (!t) { say("No access code — nothing sent.", "bad"); return; }

    go.disabled = true;
    say("Sending…");

    fetch("/api/review-request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        token: t,
        firstName: f.firstName.value,
        email: f.email.value,
        suburb: f.suburb.value,
        job: f.job.value
      })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        go.disabled = false;
        if (res.ok && res.d.ok) {
          say("Sent to " + res.d.sent, "ok");
          f.reset();
        } else if (res.d && res.d.error === "Not authorised") {
          // Wrong code saved on this device — clear it so the next try re-prompts
          // rather than silently failing forever.
          try { localStorage.removeItem(KEY); } catch (e) {}
          say("Access code was wrong. Try again.", "bad");
        } else {
          say((res.d && res.d.error) || "Could not send.", "bad");
        }
      })
      .catch(function () {
        go.disabled = false;
        say("No connection. Try again.", "bad");
      });
  });
})();
</script>
</body>
</html>
