name: Deploy to Manus

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Verify static files
        run: |
          echo "✅ Verifying static files for deployment..."
          
          # Check robots.txt content
          echo "Checking robots.txt (should allow crawlers):"
          cat public/robots.txt
          
          echo ""
          echo "Checking sitemap.xml exists:"
          test -f public/sitemap.xml && echo "✅ sitemap.xml found" || echo "❌ sitemap.xml missing"
          
          echo ""
          echo "Deployment ready - public/ folder contains:"
          ls -la public/
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "These files will be deployed to the live server."
          
      - name: Validate files are correct
        run: |
          # Ensure robots.txt allows crawlers
          grep -q "Allow: /" public/robots.txt && echo "✅ robots.txt correctly allows crawlers" || (echo "❌ ERROR: robots.txt doesn't allow crawlers!" && exit 1)
          
          # Ensure sitemap is referenced
          grep -q "Sitemap:" public/robots.txt && echo "✅ robots.txt references sitemap" || echo "⚠️ Warning: sitemap not referenced"
